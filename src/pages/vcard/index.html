<!doctype html>
<html lang="it">
  <head>
    <!-- =====================================================
         DOCUMENT
    ===================================================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biglietto da Visita | Valentina Battafarano</title>
    <meta
      name="description"
      content="Contatti digitali di Valentina Battafarano - Digital Strategist & Comunicazione. Salva il contatto o scrivimi direttamente."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://senzalievito.com/vcard/" />

    <!-- =====================================================
         PERFORMANCE
    ===================================================== -->
    <link rel="preload" href="/style.css" as="style" />
    <link rel="preload" href="/assets/logo.webp" as="image" type="image/webp" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/vcard/vcard.css" />

    <!-- =====================================================
         THEME
    ===================================================== -->
    <meta name="theme-color" content="#e85fa0" />
    <meta name="color-scheme" content="light dark" />

    <!-- =====================================================
         OPEN GRAPH
    ===================================================== -->
    <meta property="og:type" content="profile" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:site_name" content="Senza Lievito" />
    <meta
      property="og:title"
      content="Valentina Battafarano | Biglietto da Visita"
    />
    <meta
      property="og:description"
      content="Contatti digitali di Valentina Battafarano - Digital Strategist & Comunicazione."
    />
    <meta property="og:url" content="https://senzalievito.com/vcard/" />

    <!-- =====================================================
         TWITTER / X
    ===================================================== -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Valentina Battafarano | Biglietto da Visita"
    />
    <meta
      name="twitter:description"
      content="Contatti digitali di Valentina Battafarano."
    />

    <!-- =====================================================
         ICONS
    ===================================================== -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "@id": "https://senzalievito.com/vcard/#webpage",
        "url": "https://senzalievito.com/vcard/",
        "mainEntity": { "@id": "https://senzalievito.com/valentina#person" }
      }
    </script>
  </head>

  <body class="vcard-body">
    <main class="vcard-page">
      <div class="vcard-card box gradient-pink text-light glow">
        <div class="vcard-identity">
          <img
            src="/assets/logo.webp"
            alt="Senza Lievito Logo"
            class="vcard-logo"
          />
          <h1>Valentina Battafarano</h1>
          <p class="eyebrow">Digital Strategist & Comunicazione</p>
        </div>

        <ul class="vcard-details">
          <li>
            <i class="bi bi-envelope-fill" aria-hidden="true"></i>
            info@senzalievito.com
          </li>
          <li>
            <i class="bi bi-telephone-fill" aria-hidden="true"></i> +39 352 034
            5309
          </li>
        </ul>

        <div class="vcard-qr-primary">
          <img
            src="/assets/vcard-qr.svg"
            alt="QR code per salvare il contatto"
            width="176"
            height="176"
          />
          <p class="vcard-qr-caption">
            <i class="bi bi-phone" aria-hidden="true"></i> Inquadra con il tuo
            telefono per salvare il contatto
          </p>
        </div>

        <p class="vcard-footer-link">senzalievito.com</p>
      </div>
    </main>

    <!-- Scripts -->
    <script src="/script.js" defer></script>
  </body>
</html>
